<footer class="site-footer">
  <a href="mailto:{{ site.email }}">Email</a>
  {% for item in site.data.settings.social %}
    <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer">{% if item.icon == 'github' %}GitHub{% elsif item.icon == 'twitter' %}X{% elsif item.icon == 'linkedin' %}LinkedIn{% else %}{{ item.icon }}{% endif %}</a>
  {% endfor %}
</footer>
