<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="{{ site.github.url }}/">{{ site.title }}</a>
    <nav class="site-nav">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}{{ item.url }}"{% if page.url contains item.url %} class="is-active"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
